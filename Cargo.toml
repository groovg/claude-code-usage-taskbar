[package]
name = "claude-code-usage-taskbar"
version = "3.0.1"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Claude Code limits, Fable cap and session context in the Windows taskbar"
homepage = "https://github.com/groovg/claude-code-usage-taskbar"
repository = "https://github.com/groovg/claude-code-usage-taskbar"

[package.metadata.winres]
CompanyName = "groovg"
ProductName = "Claude Code Usage Taskbar"
FileDescription = "Claude Code Usage Taskbar"
OriginalFilename = "claude-code-usage-taskbar.exe"
InternalName = "ClaudeCodeUsageTaskbar"
Comments = "https://github.com/groovg/claude-code-usage-taskbar"
LegalCopyright = "Copyright (C) 2026 groovg. Based on Claude Code Usage Monitor, Copyright (C) 2025 Craig Constable"

[dependencies]
ureq = { version = "3.4", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
eframe = { version = "0.36", default-features = false, features = ["glow"] }
egui_extras = { version = "0.36", features = ["svg"] }
lucide-icons = "1.30"
raw-window-handle = "0.6"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_FileSystem",
]

[build-dependencies]
epaint_default_fonts = "0.36"
heck = "0.5"
lucide-icons = "1.30"
oxifont-subset = "0.2.2"
proc-macro2 = "1"
toml = "1.1"
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
